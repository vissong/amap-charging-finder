name: amap-charging-finder

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - "${ENV_FILE:-.env}"
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2.11-alpine
    profiles:
      - https
    environment:
      DOMAIN: "${DOMAIN:-}"
      PUBLIC_IP: "${PUBLIC_IP:-}"
      HTTPS_HOST: "${HTTPS_HOST:-}"
      TLS_SERVER_NAME: "${TLS_SERVER_NAME:-}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "${CADDY_CONFIG_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro"
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
